<section class="courses-page">
  <app-breadcrumbs></app-breadcrumbs>
  
  <div class="courses-toolbar">
    <div class="courses-toolbar__search">
      <input 
        type="text" 
        placeholder="Поиск"
        [(ngModel)]="searchTerm"
        class="search-input"
      >
      <button (click)="onSearch()" class="search-button button">
        <span>Найти</span>
      </button>
    </div>
    <div class="courses-toolbar__add-course button" routerLink="/courses/new">
      <img class="courses-toolbar__add-cours-icon" src="/assets/images/plus.svg" alt="icon">
      <span>Добавить курс</span>
    </div>
  </div>

  <div class="courses-page__container">
    <ng-container *ngIf="courses.length > 0; else noData">
      <app-course-card
        *ngFor="let course of courses; trackBy: trackById"
        [course]="course"
        (deleteCourse)="onDeleteCourse($event)"
      ></app-course-card>
      
      <div *ngIf="loadMore" class="courses-page__button button" (click)="onLoadMore()">
        Загрузить еще
      </div>
    </ng-container>

    <ng-template #noData>
      <div class="courses-page__no-data">
        <div class="courses-page__no-data-image">
          <img src="/assets/images/ban.svg" alt="Ничего не найдено">
        </div>
        <h4 *ngIf="searchTerm" class="courses-page__no-data-subtitle">
          Ничего не найдено
        </h4>
        <button (click)="resetFilters()" class="courses-page__reset-button button">
          Сбросить фильтры
        </button>
      </div>
    </ng-template>
  </div>
</section>
